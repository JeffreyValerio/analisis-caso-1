global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# --- Entrada HTTP (Actividad 2 y 4: análisis de riesgo de HTTP plano) ---
frontend http_front
    bind *:80
    default_backend web_backend

# --- Entrada HTTPS (Actividad 4: TLS con certificado auto-firmado) ---
frontend https_front
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/caso1.pem
    default_backend web_backend

# --- Backend balanceado entre las 2 instancias del contenedor web ---
backend web_backend
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server web1 web1:5000 check inter 3s fall 2 rise 2
    server web2 web2:5000 check inter 3s fall 2 rise 2

# --- Panel de estadísticas de HAProxy (Actividad 3: observar el estado
#     de cada backend y verificar el failover en vivo) ---
listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends
