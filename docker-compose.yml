services:
  web1:
    build: .
    container_name: caso1-web1
    environment:
      - INSTANCE_NAME=web1
    networks:
      - caso1net
    restart: unless-stopped

  web2:
    build: .
    container_name: caso1-web2
    environment:
      - INSTANCE_NAME=web2
    networks:
      - caso1net
    restart: unless-stopped

  haproxy:
    image: haproxy:2.9-alpine
    container_name: caso1-haproxy
    depends_on:
      - web1
      - web2
    ports:
      - "8080:80"     # HTTP
      - "8443:443"    # HTTPS
      - "8404:8404"   # HAProxy stats
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy/certs:/usr/local/etc/haproxy/certs:ro
    networks:
      - caso1net
    restart: unless-stopped

networks:
  caso1net:
    driver: bridge
